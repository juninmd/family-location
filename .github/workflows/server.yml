name: Server (testes + imagem Docker)

on:
  push:
    branches: [main]
    paths: ['server/**', 'app/src/**', 'app/public/**', 'app/package*.json', 'Dockerfile', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'app/src/**', 'Dockerfile']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npm ci --prefix app && npm run build --prefix app

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/juninmd/family-location:latest,ghcr.io/juninmd/family-location:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
